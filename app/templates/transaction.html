{% extends "base.html" %}{% block title %}Stock transaction · Inventory Tracker{% endblock %}
{% block content %}
<header class="page"><h1>Stock transaction</h1></header>
<form method="post" class="stack form" novalidate>
  <label>BoM
    <select name="bom_id" required>
      <option value="">Choose…</option>
      {% for b in boms %}<option value="{{ b.bom_id }}" {{ 'selected' if form.get('bom_id') == b.bom_id }}>{{ b.bom_id }} — {{ b.bom_name }} (in stock: {{ b.current_balance }})</option>{% endfor %}
    </select>
  </label>
  <fieldset class="choice">
    <legend>Type</legend>
    <label><input type="radio" name="txn_type" value="IN" {{ 'checked' if form.get('txn_type', 'IN') == 'IN' }}> Stock in</label>
    <label><input type="radio" name="txn_type" value="OUT" {{ 'checked' if form.get('txn_type') == 'OUT' }}> Stock out</label>
  </fieldset>
  <label>Quantity <input name="quantity" type="number" min="1" step="1" value="{{ form.get('quantity', '') }}" required></label>

  {% set txn_type = form.get('txn_type', 'IN') %}
  <div id="vendorField" {% if txn_type == 'OUT' %}hidden{% endif %}>
    <label>Vendor <input name="vendor" value="{{ form.get('vendor', '') }}" {{ 'required' if txn_type == 'IN' else '' }}></label>
  </div>
  <div id="receiverField" {% if txn_type != 'OUT' %}hidden{% endif %}>
    <label>Receiver <input name="receiver" value="{{ form.get('receiver', '') }}" {{ 'required' if txn_type == 'OUT' else '' }}></label>
  </div>
  <div id="poField" {% if txn_type != 'OUT' %}hidden{% endif %}>
    <label>PO <input name="po" value="{{ form.get('po', '') }}" {{ 'required' if txn_type == 'OUT' else '' }}></label>
  </div>

  <div class="actions">
    <button class="primary">Record transaction</button>
    <a class="button" href="{{ url_for('bom.list_bom') }}">Cancel</a>
  </div>
</form>
<script>
  const txnTypeInputs = document.querySelectorAll('input[name="txn_type"]');
  const vendorField = document.getElementById('vendorField');
  const receiverField = document.getElementById('receiverField');
  const poField = document.getElementById('poField');
  const vendorInput = vendorField.querySelector('input');
  const receiverInput = receiverField.querySelector('input');
  const poInput = poField.querySelector('input');

  function syncTxnFields() {
    const type = document.querySelector('input[name="txn_type"]:checked')?.value || 'IN';
    const isIn = type === 'IN';
    vendorField.hidden = !isIn;
    receiverField.hidden = isIn;
    poField.hidden = isIn;
    vendorInput.required = isIn;
    receiverInput.required = !isIn;
    poInput.required = !isIn;
  }

  txnTypeInputs.forEach((input) => input.addEventListener('change', syncTxnFields));
  syncTxnFields();
</script>
{% endblock %}
