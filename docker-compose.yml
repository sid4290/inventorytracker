services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DB_FILE: /app/data/inventory.db
    volumes:
      - inventory-data:/app/data
    restart: unless-stopped
volumes:
  inventory-data:
